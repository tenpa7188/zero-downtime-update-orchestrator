---
name: Lint

on:
  push:
    paths:
      - "ansible/**"
  pull_request:
    paths:
      - "ansible/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 依存関係をインストール
        run: pip install ansible ansible-lint yamllint

      - name: yamllint を実行
        run: yamllint ansible/

      - name: ansible-lint を実行
        run: ansible-lint ansible/
