---
name: Lint

on:
  push:
    paths:
      - "ansible/**"
  pull_request:
    paths:
      - "ansible/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 依存関係をインストール
        run: pip install -r requirements.txt

      - name: yamllint を実行
        run: cd ansible && yamllint ./

      - name: ansible-lint を実行
        run: cd ansible && ansible-lint playbooks/
