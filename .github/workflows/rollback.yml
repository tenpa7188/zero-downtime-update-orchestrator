---
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "切り戻し対象の環境（dev / prod）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      rollback_version:
        description: "切り戻し先の Apache バージョン（例: 2.4.52-1ubuntu4.19）"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ${{ github.event.inputs.environment == 'prod' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      id-token: write   # OIDC トークン発行に必要
      contents: write   # group_vars への git push に必要
    steps:
      - uses: actions/checkout@v5

      - name: Python 依存関係をインストールする（prod のみ）
        if: github.event.inputs.environment == 'prod'
        run: pip install -r requirements-deploy.txt

      - name: Ansible コレクションをキャッシュから復元する（prod のみ）
        if: github.event.inputs.environment == 'prod'
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: Ansible コレクションをインストールする（prod のみ）
        if: github.event.inputs.environment == 'prod'
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: AWS 認証（prod 環境のみ）
        if: github.event.inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 切り戻しを実行する
        run: |
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment }} \
            -e apache_version=${{ github.event.inputs.rollback_version }}

      - name: group_vars を切り戻しバージョンに同期する
        run: |
          VERSION="${{ github.event.inputs.rollback_version }}"
          ENV="${{ github.event.inputs.environment }}"
          sed -i "s|^apache_version:.*|apache_version: \"${VERSION}\"|" \
            ansible/inventory/${ENV}/group_vars/web.yml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ansible/inventory/${ENV}/group_vars/web.yml
          git diff --cached --quiet || \
            git commit -m "chore: apache_version を ${VERSION} に切り戻し [skip ci]"
          git push
