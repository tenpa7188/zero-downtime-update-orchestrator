---
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "切り戻し対象の環境（dev / prod）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      rollback_version:
        description: "切り戻し先の Apache バージョン（例: 2.4.52-1ubuntu4.19）"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ${{ github.event.inputs.environment == 'prod' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      id-token: write   # OIDC トークン発行に必要
      contents: write   # group_vars への git push に必要
    env:
      TARGET_ENV: ${{ github.event.inputs.environment }}
      ROLLBACK_VERSION: ${{ github.event.inputs.rollback_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Ansible 実行環境を準備する
        uses: ./.github/actions/setup-ansible-deploy
        with:
          target-environment: ${{ env.TARGET_ENV }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          collections-cache-key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: 切り戻しを実行する
        run: |
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${TARGET_ENV} \
            -e apache_version=${ROLLBACK_VERSION}

      - name: group_vars を切り戻しバージョンに同期する
        run: |
          VERSION="${ROLLBACK_VERSION}"
          ENV="${TARGET_ENV}"
          sed -i "s|^apache_version:.*|apache_version: \"${VERSION}\"|" \
            ansible/inventory/${ENV}/group_vars/web.yml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ansible/inventory/${ENV}/group_vars/web.yml
          git diff --cached --quiet || \
            git commit -m "chore: apache_version を ${VERSION} に切り戻し [skip ci]"
          git push
