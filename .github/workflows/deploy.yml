---
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ対象の環境を選択してください（dev / prod）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      apache_version:
        description: "インストールする Apache バージョン（空欄で group_vars の値を使用）"
        required: false
        default: ""
        type: string

jobs:
  dry-run:
    # prod: GitHub-hosted（SSM 経由で AWS に届く）
    # dev:  self-hosted（Vagrant へのローカル到達が必要）
    runs-on: ${{ (github.event.inputs.environment || 'dev') == 'prod' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      id-token: write   # OIDC トークン発行に必要
      contents: read
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
      APACHE_VERSION: ${{ github.event.inputs.apache_version || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Ansible 実行環境を準備する
        uses: ./.github/actions/setup-ansible-deploy
        with:
          target-environment: ${{ env.TARGET_ENV }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          collections-cache-key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: dry-run を実行
        run: |
          EXTRA_VARS=""
          if [ -n "${APACHE_VERSION}" ]; then
            EXTRA_VARS="-e apache_version=${APACHE_VERSION}"
          fi
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${TARGET_ENV} \
            --check --diff $EXTRA_VARS

  approve:
    needs: dry-run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 承認待ち
        run: echo "承認されました。デプロイを開始します。"

  deploy:
    needs:
      - dry-run
      - approve
    if: |
      always() &&
      needs.dry-run.result == 'success' &&
      ((github.event.inputs.environment || 'dev') == 'dev' || needs.approve.result == 'success')
    runs-on: ${{ (github.event.inputs.environment || 'dev') == 'prod' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      id-token: write   # OIDC トークン発行に必要
      contents: write   # group_vars への git push に必要
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
      APACHE_VERSION: ${{ github.event.inputs.apache_version || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Ansible 実行環境を準備する
        uses: ./.github/actions/setup-ansible-deploy
        with:
          target-environment: ${{ env.TARGET_ENV }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          collections-cache-key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: デプロイを実行
        run: |
          EXTRA_VARS=""
          if [ -n "${APACHE_VERSION}" ]; then
            EXTRA_VARS="-e apache_version=${APACHE_VERSION}"
          fi
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${TARGET_ENV} $EXTRA_VARS

      - name: group_vars を更新済みバージョンに同期する
        if: env.APACHE_VERSION != ''
        run: |
          VERSION="${APACHE_VERSION}"
          ENV="${TARGET_ENV}"
          sed -i "s|^apache_version:.*|apache_version: \"${VERSION}\"|" \
            ansible/inventory/${ENV}/group_vars/web.yml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ansible/inventory/${ENV}/group_vars/web.yml
          git diff --cached --quiet || \
            git commit -m "chore: apache_version を ${VERSION} に更新 [skip ci]"
          git push
