---
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ対象の環境を選択してください（dev / prod）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      apache_version:
        description: "インストールする Apache バージョン（空欄で group_vars の値を使用）"
        required: false
        default: ""
        type: string

jobs:
  dry-run:
    # prod: GitHub-hosted（SSM 経由で AWS に届く）
    # dev:  self-hosted（Vagrant へのローカル到達が必要）
    runs-on: ${{ github.event.inputs.environment == 'prod' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      id-token: write   # OIDC トークン発行に必要
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Python 依存関係をインストールする（prod のみ）
        if: github.event.inputs.environment == 'prod'
        run: pip install -r requirements.txt

      - name: Ansible コレクションをキャッシュから復元する（prod のみ）
        if: github.event.inputs.environment == 'prod'
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: Ansible コレクションをインストールする（prod のみ）
        if: github.event.inputs.environment == 'prod'
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: AWS 認証（prod 環境のみ）
        if: github.event.inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: dry-run を実行
        run: |
          EXTRA_VARS=""
          if [ -n "${{ github.event.inputs.apache_version }}" ]; then
            EXTRA_VARS="-e apache_version=${{ github.event.inputs.apache_version }}"
          fi
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment || 'dev' }} \
            --check --diff $EXTRA_VARS

  approve:
    needs: dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 承認待ち
        run: echo "承認されました。デプロイを開始します。"

  deploy:
    needs: approve
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.inputs.environment == 'prod' && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      id-token: write   # OIDC トークン発行に必要
      contents: write   # group_vars への git push に必要
    steps:
      - uses: actions/checkout@v5

      - name: Python 依存関係をインストールする（prod のみ）
        if: github.event.inputs.environment == 'prod'
        run: pip install -r requirements.txt

      - name: Ansible コレクションをキャッシュから復元する（prod のみ）
        if: github.event.inputs.environment == 'prod'
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: Ansible コレクションをインストールする（prod のみ）
        if: github.event.inputs.environment == 'prod'
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: AWS 認証（prod 環境のみ）
        if: github.event.inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: デプロイを実行
        run: |
          EXTRA_VARS=""
          if [ -n "${{ github.event.inputs.apache_version }}" ]; then
            EXTRA_VARS="-e apache_version=${{ github.event.inputs.apache_version }}"
          fi
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment }} $EXTRA_VARS

      - name: group_vars を更新済みバージョンに同期する
        if: github.event.inputs.apache_version != ''
        run: |
          VERSION="${{ github.event.inputs.apache_version }}"
          ENV="${{ github.event.inputs.environment }}"
          sed -i "s|^apache_version:.*|apache_version: \"${VERSION}\"|" \
            ansible/inventory/${ENV}/group_vars/web.yml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ansible/inventory/${ENV}/group_vars/web.yml
          git diff --cached --quiet || \
            git commit -m "chore: apache_version を ${VERSION} に更新 [skip ci]"
          git push
