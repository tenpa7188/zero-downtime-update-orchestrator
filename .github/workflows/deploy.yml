---
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ対象の環境を選択してください（dev / prod）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      apache_version:
        description: "インストールする Apache バージョン（空欄で group_vars の値を使用）"
        required: false
        default: ""
        type: string

jobs:
  dry-run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: SSH 秘密鍵を設定する
        # 本番運用時は GitHub Secrets に登録した秘密鍵をここで配置する
        # run: |
        #   mkdir -p ~/.ssh
        #   echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        #   chmod 600 ~/.ssh/id_rsa
        run: echo "秘密鍵設定はローカル環境では省略"

      - name: dry-run を実行
        run: |
          EXTRA_VARS=""
          if [ -n "${{ github.event.inputs.apache_version }}" ]; then
            EXTRA_VARS="-e apache_version=${{ github.event.inputs.apache_version }}"
          fi
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment || 'dev' }} \
            --check --diff $EXTRA_VARS

  approve:
    needs: dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    steps:
      - name: 承認待ち
        run: echo "承認されました。デプロイを開始します。"

  deploy:
    needs: approve
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: SSH 秘密鍵を設定する
        # 本番運用時は GitHub Secrets に登録した秘密鍵をここで配置する
        # run: |
        #   mkdir -p ~/.ssh
        #   echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        #   chmod 600 ~/.ssh/id_rsa
        run: echo "秘密鍵設定はローカル環境では省略"

      - name: デプロイを実行
        run: |
          EXTRA_VARS=""
          if [ -n "${{ github.event.inputs.apache_version }}" ]; then
            EXTRA_VARS="-e apache_version=${{ github.event.inputs.apache_version }}"
          fi
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment }} $EXTRA_VARS

      - name: group_vars を更新済みバージョンに同期する
        if: github.event.inputs.apache_version != ''
        run: |
          VERSION="${{ github.event.inputs.apache_version }}"
          ENV="${{ github.event.inputs.environment }}"
          sed -i "s|^apache_version:.*|apache_version: \"${VERSION}\"|" \
            ansible/inventory/${ENV}/group_vars/web.yml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ansible/inventory/${ENV}/group_vars/web.yml
          git diff --cached --quiet || \
            git commit -m "chore: apache_version を ${VERSION} に更新 [skip ci]"
          git push
