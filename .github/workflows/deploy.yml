---
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ対象の環境を選択してください（dev / prod）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  dry-run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: SSH 秘密鍵を設定する
        # 本番運用時は GitHub Secrets に登録した秘密鍵をここで配置する
        # run: |
        #   mkdir -p ~/.ssh
        #   echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        #   chmod 600 ~/.ssh/id_rsa
        run: echo "秘密鍵設定はローカル環境では省略"

      - name: dry-run を実行
        run: |
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment || 'dev' }} \
            --check --diff

  approve:
    needs: dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    steps:
      - name: 承認待ち
        run: echo "承認されました。デプロイを開始します。"

  deploy:
    needs: approve
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: SSH 秘密鍵を設定する
        # 本番運用時は GitHub Secrets に登録した秘密鍵をここで配置する
        # run: |
        #   mkdir -p ~/.ssh
        #   echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        #   chmod 600 ~/.ssh/id_rsa
        run: echo "秘密鍵設定はローカル環境では省略"

      - name: デプロイを実行
        run: |
          cd ansible && ansible-playbook playbooks/rolling_update.yml \
            -i inventory/${{ github.event.inputs.environment }}
