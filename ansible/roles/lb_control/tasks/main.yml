---
- name: LB のプロキシ設定を配置する
  template:
    src: proxy.conf.j2
    dest: /etc/nginx/conf.d/proxy.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  delegate_to: lb01

- name: LB の upstream 設定を更新する
  template:
    src: upstream.conf.j2
    dest: /etc/nginx/conf.d/upstream.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  delegate_to: lb01

- name: proxy.conf のバックアップ世代管理
  include_tasks: backup_cleanup.yml
  vars:
    backup_pattern: /etc/nginx/conf.d/proxy.conf.*~
    backup_keep: "{{ proxy_backup_generations }}"

- name: upstream.conf のバックアップ世代管理
  include_tasks: backup_cleanup.yml
  vars:
    backup_pattern: /etc/nginx/conf.d/upstream.conf.*~
    backup_keep: "{{ upstream_backup_generations }}"

- name: LB の nginx を reload する
  service:
    name: nginx
    state: reloaded
  changed_when: false
  become: true
  delegate_to: lb01
