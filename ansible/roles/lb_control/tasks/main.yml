---
- name: LB のプロキシ設定を配置する
  template:
    src: proxy.conf.j2
    dest: /etc/nginx/conf.d/proxy.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  delegate_to: lb01

- name: LB の upstream 設定を更新する
  template:
    src: upstream.conf.j2
    dest: /etc/nginx/conf.d/upstream.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  delegate_to: lb01

- name: 古いバックアップを削除する（直近3世代のみ残す）
  shell: |
    ls -t /etc/nginx/conf.d/*.conf.*~ 2>/dev/null | tail -n +4 | xargs rm -f
  changed_when: false
  become: true

- name: LB の nginx を reload する
  service:
    name: nginx
    state: reloaded
  become: true
  delegate_to: lb01
