---
- name: LB の nginx 設定を配置する
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  delegate_to: "{{ lb_control_host }}"
  loop: "{{ lb_control_nginx_templates }}"
  loop_control:
    label: "{{ item.dest }}"

- name: LB の nginx 設定バックアップを世代管理する
  ansible.builtin.include_tasks: backup_cleanup.yml
  vars:
    backup_pattern: "{{ item.backup_pattern }}"
    backup_keep: "{{ item.backup_keep }}"
    backup_delegate_to: "{{ lb_control_host }}"
  loop: "{{ lb_control_nginx_templates }}"
  loop_control:
    label: "{{ item.dest }}"

- name: LB の nginx を reload する
  ansible.builtin.service:
    name: nginx
    state: reloaded
  changed_when: false
  become: true
  delegate_to: "{{ lb_control_host }}"

- name: ドレイン後の既存接続が抜けるのを待つ
  ansible.builtin.pause:
    seconds: "{{ lb_control_drain_wait }}"
  when:
    - lb_control_action == 'drain'
    - lb_control_drain_wait | int > 0
    - not ansible_check_mode
