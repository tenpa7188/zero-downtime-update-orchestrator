---
- name: nginx をインストールする
  apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: false
  become: true

- name: nginx の設定ファイルを配置する
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: reload_nginx
