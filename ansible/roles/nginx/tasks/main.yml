---
- name: LB 用 Nginx をインストールする
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: false
  become: true

- name: LB 用 Nginx の設定ファイルを配置する
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Reload nginx

- name: 古いバックアップを削除する（直近3世代のみ残す）
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls -t /etc/nginx/nginx.conf.*~ 2>/dev/null \
        | tail -n +4 \
        | xargs -r rm -f
    executable: /bin/bash
  changed_when: false
  failed_when: false
  become: true
