---
- name: nginx をインストールする
  apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: false
  become: true

- name: nginx の設定ファイルを配置する
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: reload_nginx

- name: 古いバックアップを削除する（直近3世代のみ残す）
  shell: |
    ls -t /etc/nginx/nginx.conf.*~ 2>/dev/null | tail -n +4 | xargs rm -f
  changed_when: false
  become: true
