---
- name: LB 用 Nginx をインストールする
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: false
  become: true

- name: LB 用 Nginx の設定ファイルを配置する
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Reload nginx

- name: LB 用 Nginx 設定バックアップを世代管理する
  ansible.builtin.include_role:
    name: backup_cleanup
  vars:
    backup_cleanup_pattern: /etc/nginx/nginx.conf.*~
    backup_cleanup_keep: "{{ nginx_config_backup_generations }}"
