---
- name: ALB ターゲットグループ ARN を動的に取得する（prod のみ）
  hosts: localhost
  gather_facts: false
  tasks:
    - name: ターゲットグループ情報を取得する
      community.aws.elb_target_group_info:
        names:
          - "{{ project_name }}-tg"
        region: "{{ aws_region }}"
      register: tg_info
      when: lb_control_type | default('nginx') == 'alb'

    - name: Lb_target_group_arn をセットする
      ansible.builtin.set_fact:
        lb_target_group_arn: "{{ tg_info.target_groups[0].target_group_arn }}"
      when: lb_control_type | default('nginx') == 'alb'

- name: Lb_target_group_arn を web ホストに配布する（prod のみ）
  hosts: web
  gather_facts: false
  tasks:
    - name: Lb_target_group_arn をセットする
      ansible.builtin.set_fact:
        lb_target_group_arn: >-
          {{ hostvars['localhost']['lb_target_group_arn'] }}
      when: lb_control_type | default('nginx') == 'alb'

- name: LB に nginx をセットアップする
  hosts: lb
  roles:
    - nginx

- name: LB の初期プロキシ設定を行う（nginx LB のみ）
  hosts: web
  run_once: true
  tasks:
    - name: LB に proxy.conf・upstream.conf を配置する
      ansible.builtin.include_role:
        name: lb_control
      vars:
        lb_control_action: restore
      when: lb_control_type | default('nginx') == 'nginx'

- name: ローリング更新
  hosts: web
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: LB からサーバを切り離す
      ansible.builtin.include_role:
        name: lb_control
      vars:
        lb_control_action: drain

  roles:
    - apache

  post_tasks:
    - name: 動作確認
      ansible.builtin.include_role:
        name: healthcheck

    - name: LB にサーバを組み込む
      ansible.builtin.include_role:
        name: lb_control
      vars:
        lb_control_action: restore
